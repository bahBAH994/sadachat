name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web app
        run: npm run build

      - name: Prepare Android project
        run: |
          rm -rf android capacitor.config.ts capacitor.config.js
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.sada.voicechat",
            "appName": "صَدَى - SADA",
            "webDir": "dist",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Configure immersive Android fullscreen
        run: |
          cat > android/app/src/main/java/com/sada/voicechat/MainActivity.java <<'EOF'
          package com.sada.voicechat;

          import android.os.Bundle;
          import android.view.View;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              private void hideSystemBars() {
                  WindowCompat.setDecorFitsSystemWindows(getWindow(), false);
                  WindowInsetsControllerCompat controller =
                      new WindowInsetsControllerCompat(getWindow(), getWindow().getDecorView());
                  controller.hide(WindowInsetsCompat.Type.systemBars());
                  controller.setSystemBarsBehavior(
                      WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                  );
                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_FULLSCREEN |
                      View.SYSTEM_UI_FLAG_HIDE_NAVIGATION |
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                  );
              }

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  hideSystemBars();
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) hideSystemBars();
              }
          }
          EOF

          python3 - <<'EOF'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          if 'android:windowSoftInputMode="adjustResize"' not in s:
              s = s.replace('android:exported="true"', 'android:exported="true"\n            android:windowSoftInputMode="adjustResize"', 1)
          if 'android.permission.RECORD_AUDIO' not in s:
              s = s.replace('<application', '<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <application', 1)
          p.write_text(s)
          EOF

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build Android APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sada-native-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
