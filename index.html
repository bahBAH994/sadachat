    />

      name="description"
      content="منصة صَدَى للوكالات الصوتية المباشرة، البث الحي، الألعاب، والمحادثات الفورية."
    />
    <meta property="og:title" content="صَدَى - SADA | الوكالات الصوتية والمسابقات الملكية" />
    <meta
      property="og:description"
      content="منصة صَدَى للوكالات الصوتية المباشرة، البث الحي، الألعاب، والمحادثات الفورية."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0b0e17" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="صَدَى SADA" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      @keyframes sadaBootSpin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes sadaBootPulse {
        0%, 100% { transform: scale(1); opacity: 0.92; }
        50% { transform: scale(1.05); opacity: 1; }
      }
      #sada-boot-loader {
        min-height: 100vh;
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
        background: radial-gradient(circle at 50% 35%, #162238 0%, #070913 75%);
        color: #FCE9A6;
        font-family: 'Cairo', system-ui, -apple-system, sans-serif;
        text-align: center;
      }
      #sada-boot-emblem {
        width: 60px;
        height: 60px;
        border-radius: 18px;
        border: 2px solid rgba(243, 211, 122, 0.75);
        background: linear-gradient(145deg, #1b2842 0%, #0b1120 100%);
        box-shadow: 0 0 24px rgba(212, 175, 55, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.15);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        font-weight: 800;
        color: #FCE9A6;
        margin-bottom: 12px;
        animation: sadaBootPulse 1.6s ease-in-out infinite;
      }
      #sada-boot-spinner {
        width: 24px;
        height: 24px;
        border-radius: 9999px;
        border: 3px solid rgba(243, 211, 122, 0.2);
        border-top-color: #D4AF37;
        margin-top: 14px;
        animation: sadaBootSpin 0.85s linear infinite;
      }
      #sada-boot-error {
        display: none;
        margin-top: 16px;
        max-width: 360px;
        width: 100%;
        padding: 14px;
        border-radius: 16px;
        background: rgba(127, 29, 29, 0.55);
        border: 1px solid rgba(248, 113, 113, 0.55);
        color: #fecaca;
        font-size: 12px;
        line-height: 1.6;
        word-break: break-word;
      }
      #sada-boot-reload {
        margin-top: 10px;
        padding: 10px 18px;
        border-radius: 12px;
        border: none;
        background: linear-gradient(135deg, #F0D278 0%, #D4AF37 100%);
        color: #070913;
        font-weight: 800;
        font-size: 13px;
        cursor: pointer;
      }
    </style>
    <script>
      (function () {
        function showBootError(msg) {
          var box = document.getElementById('sada-boot-error');
          var txt = document.getElementById('sada-boot-error-text');
          var spin = document.getElementById('sada-boot-spinner');
          if (!box || !txt) return;
          if (spin) spin.style.display = 'none';
          box.style.display = 'block';
          txt.textContent = msg || 'حدث خطأ أثناء تشغيل التطبيق على هذا المتصفح.';
        }
        window.addEventListener('error', function (ev) {
          if (document.getElementById('sada-boot-loader')) {
            showBootError((ev && ev.message) || 'خطأ في تحميل السكربت الأساسي.');
          }
        });
        window.addEventListener('unhandledrejection', function (ev) {
          if (document.getElementById('sada-boot-loader')) {
            var reason = ev && ev.reason;
            showBootError((reason && reason.message) || String(reason || 'تعذّر إكمال التحميل.'));
          }
        });
        // Mandatory 2.5s safety timeout so splash loader never freezes on slow phones/networks
        window.setTimeout(function () {
          var loader = document.getElementById('sada-boot-loader');
          if (loader) {
            loader.style.opacity = '0';
            loader.style.transition = 'opacity 200ms ease';
            window.setTimeout(function () {
              var errBox = document.getElementById('sada-boot-error');
              if (loader && loader.parentNode && (!errBox || errBox.style.display !== 'block')) {
                loader.style.display = 'none';
              }
            }, 220);
          }
        }, 2500);
      })();
    </script>
  </head>
  <body class="bg-[#F5F6FA] text-slate-900 antialiased selection:bg-emerald-500/20 selection:text-emerald-900">
    <div id="root">
      <div id="sada-boot-loader" role="status" aria-live="polite">
        <div id="sada-boot-emblem">صَدَى</div>
        <div style="font-size: 18px; font-weight: 800; letter-spacing: -0.01em;">
          صَدَى - SADA
        </div>
        <div style="font-size: 12px; color: #cbd5e1; margin-top: 4px;">
          جارٍ التحميل...
        </div>
        <div id="sada-boot-spinner" aria-hidden="true"></div>
        <div id="sada-boot-error">
          <div style="font-weight: 800; margin-bottom: 4px; color: #fff;">تعذّر بدء التشغيل</div>
          <div id="sada-boot-error-text" dir="ltr"></div>
          <button id="sada-boot-reload" type="button" onclick="window.location.reload()">
            إعادة تحميل الصفحة
          </button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
